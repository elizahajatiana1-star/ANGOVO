<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANGOVO — Paiement</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
    *[x-cloak] { display: none !important; }
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --or:#E65100;--orl:#FF6D00;--orl2:#FFF3E0;
      --gnm:#2E7D32;--gnl:#E8F5E9;
      --blk:#0D0D0D;
      --wh:#FFFFFF;--wh2:#F9F8F6;
      --t1:#111111;--t2:#555555;--t3:#999999;
      --bdr:rgba(0,0,0,0.08);
    }
    body{font-family:'DM Sans',system-ui,sans-serif;color:var(--t1);background:var(--wh2);min-height:100vh;}
    
    .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 36px;background:var(--wh);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100;}
    .nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
    .logo-badge {width: 36px; height: 36px; background: linear-gradient(135deg, #2E7D32 0%, #E65100 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center;}
    .logo-badge svg { width: 22px; height: 22px; fill: #FFFFFF; }
    .brand-txt{display:flex;flex-direction:column;}
    .brand-main{font-size:18px;font-weight:800;color:var(--blk);letter-spacing:0.5px;}
    .brand-sub{font-size:8.5px;color:var(--gnm);font-weight:700;letter-spacing:0.5px;}

    /* Menu desktop */
    .nav-menu{display:flex;gap:4px;background:var(--wh2);padding:4px;border-radius:10px;border:1px solid var(--bdr);}
    .nav-btn{background:none;border:none;padding:8px 16px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;border-radius:7px;text-decoration:none;transition:all 0.2s;}
    .nav-btn:hover{color:var(--t1);background:rgba(0,0,0,0.03);}
    .nav-btn.active{color:var(--blk);background:var(--wh);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.04);}

    .nav-right{display:flex;align-items:center;gap:14px;}
    .user-avatar{width:34px;height:34px;background:var(--or);color:var(--wh);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
    
    .logout-btn{background:none;border:1px solid var(--bdr);color:#c62828;font-size:13px;font-weight:600;cursor:pointer;padding:6px 14px;border-radius:8px;transition:0.2s;}
    .logout-btn:hover{background:#ffebee;border-color:transparent;}

    .mobile-logout-btn { display: none; }
    .hamburger-btn { display: none; background: none; border: 1px solid var(--bdr); padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 18px; }

    .container{max-width:900px;margin:30px auto;padding:0 24px;}
    .view-title{font-size:24px;font-weight:700;margin-bottom:24px;color:var(--blk);}

    .card{background:var(--wh);border:1px solid var(--bdr);border-radius:14px;padding:30px;margin-bottom:24px;}
    .card-title{font-size:16px;font-weight:700;color:var(--blk);margin-bottom:20px;display:flex;align-items:center;gap:8px;}

    .facture-resume{background:var(--wh2);border:1px solid var(--bdr);border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
    .facture-ref{font-family:'DM Mono',monospace;font-size:13px;color:var(--t2);}
    .facture-montant{font-size:20px;font-weight:700;color:var(--or);}

    .methods-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px;margin-bottom:24px;}
    .method-card{border:2px solid var(--bdr);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--wh);}
    .method-card.selected{border-color:var(--or);background:var(--orl2);}
    .method-title{font-size:13px;font-weight:700;color:var(--blk);margin-top:8px;}

    .form-group{margin-bottom:18px;}
    .form-label{display:block;font-size:12.5px;font-weight:700;color:var(--t2);margin-bottom:6px;}
    .form-input{width:100%;padding:12px 14px;border:1px solid var(--bdr);border-radius:8px;font-size:14px;outline:none;font-family:inherit;}
    .form-input:focus{border-color:var(--or);}

    .btn-payer-final{width:100%;background:var(--or);color:var(--wh);border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:background 0.2s;}
    .btn-payer-final:hover{background:var(--orl);}

    /* Style du mini reçu */
    .receipt-box {
      background: var(--gnl); border: 1px solid #C8E6C9; border-radius: 12px;
      padding: 24px; margin-top: 10px;
    }
    .receipt-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid #C8E6C9; padding-bottom: 12px; }
    .receipt-title { font-weight: 700; color: var(--gnm); font-size: 16px; }
    .receipt-row { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 10px; color: var(--t2); }
    .receipt-val { font-weight: 700; color: var(--blk); font-family: 'DM Mono', monospace; }
    .btn-nouveau { width: 100%; background: var(--wh); border: 1px solid var(--bdr); color: var(--t1); padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 16px; }
    .btn-nouveau:hover { background: #eee; }

    @media (max-width: 768px) {
      .nav{padding:14px 18px;}
      .hamburger-btn { display: block; }
      .nav-menu {
        display: none; position: absolute; top: 70px; left: 0; width: 100%;
        background: var(--wh); flex-direction: column; padding: 16px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.08); border-top: 1px solid var(--bdr); gap: 8px;
      }
      .nav-menu.open { display: flex; }
      .nav-menu .nav-btn { width: 100%; text-align: left; padding: 12px 16px; }
      
      .logout-btn { display: none; }
      .mobile-logout-btn {
        display: block; width: 100%; background: #ffebee; border: none;
        color: #c62828; font-size: 14px; font-weight: 700; cursor: pointer;
        padding: 12px 16px; border-radius: 8px; text-align: left; margin-top: 8px;
      }
      .methods-grid{grid-template-columns:1fr;}
      .facture-resume{flex-direction:column;align-items:flex-start;gap:10px;}
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="paiementApp" x-cloak>

  <nav class="nav">
    <a href="dashboard.html" class="nav-brand">
      <div class="logo-badge"><svg viewBox="0 0 24 24"><path d="M13,2L3,14H11V22L21,10H13V2Z"/></svg></div>
      <div class="brand-txt"><span class="brand-main">ANGOVO</span><span class="brand-sub">L'ÉNERGIE À PORTÉE DE MAIN</span></div>
    </a>
    
    <button class="hamburger-btn" @click="menuOpen = !menuOpen">☰</button>

    <div class="nav-menu" :class="{'open': menuOpen}">
      <a href="dashboard.html" class="nav-btn">Tableau de bord</a>
      <a href="facture.html" class="nav-btn">Factures</a>
      <a href="consommation.html" class="nav-btn">Consommation</a>
      <a href="paiement.html" class="nav-btn active">Paiement</a>
      <a href="conseil.html" class="nav-btn">Conseils</a>
      <a href="plan.html" class="nav-btn">Plans</a>
      <a href="profil.html" class="nav-btn">Profil</a>
      
      <button @click="logout()" class="mobile-logout-btn">Déconnexion</button>
    </div>

    <div class="nav-right">
      <div class="user-avatar">U</div>
      <button @click="logout()" class="logout-btn">Déconnexion</button>
    </div>
  </nav>

  <div class="container">
    <h2 class="view-title">Règlement de facture</h2>

    <div class="card">
      <div class="card-title">🧾 Facture en cours</div>
      <div class="facture-resume">
        <div>
          <div style="font-weight:700; font-size:15px; color:var(--blk);">Facture Mai 2025 (187 kWh)</div>
          <div class="facture-ref">N° FAC-2025-05-1042</div>
        </div>
        <div class="facture-montant">48 200 Ar</div>
      </div>

      <template x-if="!succes">
        <div>
          <div class="card-title" style="margin-top:24px;">💳 Choisissez votre moyen de paiement</div>
          <div class="methods-grid">
            <div class="method-card" :class="{'selected': mode === 'mvola'}" @click="mode = 'mvola'">
              <div style="font-size:20px;">📱</div>
              <div class="method-title">MVola</div>
            </div>
            <div class="method-card" :class="{'selected': mode === 'orange'}" @click="mode = 'orange'">
              <div style="font-size:20px;">📱</div>
              <div class="method-title">Orange Money</div>
            </div>
            <div class="method-card" :class="{'selected': mode === 'carte'}" @click="mode = 'carte'">
              <div style="font-size:20px;">💳</div>
              <div class="method-title">Carte Bancaire</div>
            </div>
          </div>

          <template x-if="mode === 'mvola' || mode === 'orange'">
            <div>
              <div class="form-group">
                <label class="form-label" x-text="'Numéro ' + (mode === 'mvola' ? 'MVola (034 / 038)' : 'Orange Money (032 / 037)')"></label>
                <input type="text" class="form-input" placeholder="Ex: 034 00 000 00" x-model="inputNumero">
              </div>
              <button class="btn-payer-final" @click="payer()">Valider le paiement de 48 200 Ar</button>
            </div>
          </template>

          <template x-if="mode === 'carte'">
            <div>
              <div class="form-group">
                <label class="form-label">Numéro de carte</label>
                <input type="text" class="form-input" placeholder="4532 •••• •••• ••••" x-model="inputNumero">
              </div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
                <div class="form-group">
                  <label class="form-label">Date d'expiration</label>
                  <input type="text" class="form-input" placeholder="MM/AA">
                </div>
                <div class="form-group">
                  <label class="form-label">CVV</label>
                  <input type="text" class="form-input" placeholder="123">
                </div>
              </div>
              <button class="btn-payer-final" @click="payer()">Payer 48 200 Ar sécurisés</button>
            </div>
          </template>
        </div>
      </template>

      <template x-if="succes">
        <div class="receipt-box">
          <div class="receipt-header">
            <div class="receipt-title">✅ Reçu de Paiement Angovo</div>
            <div style="font-size:12px; color:var(--gnm); font-weight:700;">Payé avec succès</div>
          </div>
          <div class="receipt-row">
            <span>N° Compteur :</span>
            <span class="receipt-val" x-text="numCompteur"></span>
          </div>
          <div class="receipt-row">
            <span>N° Inséré / Référence :</span>
            <span class="receipt-val" x-text="champSaisi"></span>
          </div>
          <div class="receipt-row">
            <span>Date & Heure :</span>
            <span class="receipt-val" x-text="datePaiement"></span>
          </div>
          <div class="receipt-row">
            <span>Montant réglé :</span>
            <span class="receipt-val" style="color:var(--or);">48 200 Ar</span>
          </div>
          <button class="btn-nouveau" @click="reinitialiser()">Effectuer un autre règlement</button>
        </div>
      </template>
    </div>

  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('paiementApp', () => ({
        menuOpen: false,
        mode: 'mvola',
        inputNumero: '',
        champSaisi: '',
        numCompteur: 'CMT-1042',
        datePaiement: '',
        succes: false,

        init() {
          if (!localStorage.getItem('angovo_user_id')) {
            window.location.replace('connexion.html');
          }
        },

        payer() {
          this.champSaisi = this.inputNumero || '034 12 345 67';
          
          const now = new Date();
          const options = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
          this.datePaiement = now.toLocaleDateString('fr-FR', options);

          // Enregistrement de l'état payé dans le localStorage
          localStorage.setItem('angovo_facture_payee', 'true');

          this.succes = true;
        },

        reinitialiser() {
          localStorage.removeItem('angovo_facture_payee');
          this.succes = false;
          this.inputNumero = '';
        },

        logout() {
          localStorage.removeItem('angovo_user_id');
          window.location.replace('connexion.html');
        }
      }));
    });
  </script>
</body>
</html>
