<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANGOVO — Tableau de bord</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
    *[x-cloak] { display: none !important; }
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --or:#E65100;--orl:#FF6D00;--orl2:#FFF3E0;
      --gnm:#2E7D32;--gnl:#E8F5E9;
      --blk:#0D0D0D;
      --wh:#FFFFFF;--wh2:#F9F8F6;
      --t1:#111111;--t2:#555555;--t3:#999999;
      --bdr:rgba(0,0,0,0.08);
    }
    body{
      font-family:'DM Sans',system-ui,sans-serif;
      color:var(--t1);
      background:var(--wh2);
      min-height:100vh;
    }
    .nav{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 36px;background:var(--wh);border-bottom:1px solid var(--bdr);
      position:sticky;top:0;z-index:100;
    }
    .nav-brand{
      display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
    }
    .logo-badge {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #2E7D32 0%, #E65100 100%);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .logo-badge svg { width: 22px; height: 22px; fill: #FFFFFF; }
    .brand-txt{display:flex;flex-direction:column;}
    .brand-main{font-size:18px;font-weight:800;color:var(--blk);letter-spacing:0.5px;}
    .brand-sub{font-size:8.5px;color:var(--gnm);font-weight:700;letter-spacing:0.5px;}

    /* Menu desktop */
    .nav-menu{display:flex;gap:4px;background:var(--wh2);padding:4px;border-radius:10px;border:1px solid var(--bdr);}
    .nav-btn{
      background:none;border:none;padding:8px 16px;font-size:13px;font-weight:500;
      color:var(--t2);cursor:pointer;border-radius:7px;text-decoration:none;transition:all 0.2s;
    }
    .nav-btn:hover{color:var(--t1);background:rgba(0,0,0,0.03);}
    .nav-btn.active{color:var(--blk);background:var(--wh);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.04);}

    .nav-right{display:flex;align-items:center;gap:14px;}
    .badge-gratuit{font-size:12px;color:var(--t2);background:#f0eae1;padding:6px 12px;border-radius:20px;font-weight:500;}
    .user-avatar{width:34px;height:34px;background:var(--or);color:var(--wh);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
    
    .logout-btn{background:none;border:1px solid var(--bdr);color:#c62828;font-size:13px;font-weight:600;cursor:pointer;padding:6px 14px;border-radius:8px;transition:0.2s;}
    .logout-btn:hover{background:#ffebee;border-color:transparent;}

    .mobile-logout-btn { display: none; }
    .hamburger-btn {
      display: none; background: none; border: 1px solid var(--bdr);
      padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 18px;
    }

    .container{max-width:1240px;margin:30px auto;padding:0 24px;}
    
    .alert-banner{
      background:#FFF8E1;border:1px solid #FFE082;border-radius:12px;padding:16px 22px;
      display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;
    }
    .alert-txt{display:flex;align-items:center;gap:12px;font-size:14px;color:#795548;font-weight:500;}
    .btn-payer{background:var(--or);color:var(--wh);border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;}
    .btn-payer:hover{background:var(--orl);}

    .metrics-grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:20px;margin-bottom:28px;}
    .metric-card{background:var(--wh);border:1px solid var(--bdr);border-radius:14px;padding:22px;position:relative;overflow:hidden;}
    .metric-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;}
    .metric-val{font-size:26px;font-weight:700;color:var(--blk);margin-bottom:6px;}
    .metric-sub{font-size:12.5px;color:var(--t2);}
    .metric-sub.alert{color:var(--or);font-weight:600;}
    .metric-sub.success{color:var(--gnm);font-weight:600;}

    .main-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-bottom:28px;}
    .card{background:var(--wh);border:1px solid var(--bdr);border-radius:14px;padding:24px;}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .card-title{font-size:15px;font-weight:700;color:var(--blk);}
    .card-link{font-size:12px;color:var(--or);font-weight:600;text-decoration:none;cursor:pointer;}

    .facture-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bdr);}
    .facture-item:last-child{border-bottom:none;}
    .facture-info{display:flex;flex-direction:column;gap:2px;}
    .facture-mois{font-size:13.5px;font-weight:700;color:var(--blk);}
    .facture-conso{font-size:11.5px;color:var(--t3);}
    .facture-right{text-align:right;display:flex;flex-direction:column;gap:2px;}
    .facture-prix{font-size:13.5px;font-weight:700;color:var(--blk);}
    .facture-status{font-size:11px;font-weight:600;}
    .status-attente{color:var(--or);}
    .status-payee{color:var(--gnm);}

    .chart-container{display:flex;align-items:flex-end;gap:14px;height:160px;padding-top:20px;border-bottom:1px solid var(--bdr);}
    .chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;}
    .chart-bar{width:100%;background:var(--gnm);border-radius:6px 6px 0 0;transition:height 0.4s;}
    .chart-bar.current{background:var(--or);}
    .chart-label{font-size:11px;color:var(--t3);margin-top:8px;}
    .chart-val{font-size:10px;font-weight:700;color:var(--t2);margin-bottom:4px;}

    @media (max-width: 1024px) {
      .metrics-grid{grid-template-columns:repeat(2, 1fr);}
      .main-grid{grid-template-columns:1fr;}
    }

    @media (max-width: 768px) {
      .nav{padding:14px 18px;}
      .hamburger-btn {display: block;}
      
      .nav-menu {
        display: none; position: absolute; top: 70px; left: 0; width: 100%;
        background: var(--wh); flex-direction: column; padding: 16px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.08); border-top: 1px solid var(--bdr);
        gap: 8px;
      }
      .nav-menu.open { display: flex; }
      
      .nav-menu .nav-btn {
        width: 100%; text-align: left; padding: 12px 16px;
      }

      .badge-gratuit { display: none; } 
      
      .logout-btn { display: none; }
      .mobile-logout-btn {
        display: block; width: 100%; background: #ffebee; border: none;
        color: #c62828; font-size: 14px; font-weight: 700; cursor: pointer;
        padding: 12px 16px; border-radius: 8px; text-align: left; margin-top: 8px;
      }
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="dashboardApp" x-cloak>

  <nav class="nav">
    <a href="/dashboard" class="nav-brand">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M13,2L3,14H11V22L21,10H13V2Z"/></svg>
      </div>
      <div class="brand-txt">
        <span class="brand-main">ANGOVO</span>
        <span class="brand-sub">L'ÉNERGIE À PORTÉE DE MAIN</span>
      </div>
    </a>
    
    <button class="hamburger-btn" @click="menuOpen = !menuOpen">☰</button>

    <div class="nav-menu" :class="{'open': menuOpen}">
      <a href="/dashboard" class="nav-btn active">Tableau de bord</a>
      <a href="/facture" class="nav-btn">Factures</a>
      <a href="/consommation" class="nav-btn">Consommation</a>
      <a href="/paiement" class="nav-btn">Paiement</a>
      <a href="/conseil" class="nav-btn">Conseils</a>
      <a href="/plan" class="nav-btn">Plans</a>
      <a href="/profil" class="nav-btn">Profil</a>
      
      <button @click="logout()" class="mobile-logout-btn">Déconnexion</button>
    </div>

    <div class="nav-right">
      <span class="badge-gratuit" x-text="userProfile.plan || 'Standard'"></span>
      <div class="user-avatar" x-text="initiales"></div>
      <button @click="logout()" class="logout-btn">Déconnexion</button>
    </div>
  </nav>

  <div class="container">
    
    <template x-if="factureEnAttente && !facturePayee">
      <div class="alert-banner">
        <div class="alert-txt">
          ⚠️ <span x-text="'Facture en attente : ' + factureEnAttente.montant + ' Ar pour ' + factureEnAttente.mois + ' — échéance le ' + factureEnAttente.echeance + '.'"></span>
        </div>
        <button class="btn-payer" @click="window.location.href='/paiement'">Payer maintenant</button>
      </div>
    </template>

    <template x-if="facturePayee">
      <div style="background:var(--gnl);border:1px solid #C8E6C9;border-radius:12px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;">
        <div style="display:flex;align-items:center;gap:12px;font-size:14px;color:var(--gnm);font-weight:700;">
          ✅ Toutes vos factures sont à jour. Merci pour votre règlement !
        </div>
      </div>
    </template>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">Solde dû</div>
        <div class="metric-val" x-text="facturePayee ? '0 Ar' : (factureEnAttente ? factureEnAttente.montant + ' Ar' : '0 Ar')"></div>
        <div class="metric-sub" :class="facturePayee ? 'success' : 'alert'" x-text="facturePayee ? '● Réglé' : '⚡ En attente'"></div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Consommation</div>
        <div class="metric-val" x-text="consoMoisActuel + ' kWh'"></div>
        <div class="metric-sub alert">Ce mois (+13% vs avril)</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Dernier paiement</div>
        <div class="metric-val" x-text="facturePayee ? '48 200 Ar' : dernierPaiement.montant + ' Ar'"></div>
        <div class="metric-sub success">Payé avec succès</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Compteur</div>
        <div class="metric-val" style="font-size: 22px; margin-top: 4px;" x-text="userProfile.num_compteur || 'CMT-1042'"></div>
        <div class="metric-sub success">ANT · Actif</div>
      </div>
    </div>

    <div class="main-grid">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Évolution des factures</div>
          <span style="font-size:11px;background:var(--orl2);color:var(--or);padding:3px 8px;border-radius:6px;font-weight:700;">6 mois</span>
        </div>
        <div class="chart-container">
          <template x-for="item in historiqueFactures">
            <div class="chart-bar-wrap">
              <div class="chart-val" x-text="(item.montant / 1000).toFixed(1) + 'k'"></div>
              <div class="chart-bar" :class="{'current': item.isCurrent}" :style="'height: ' + (item.montant / 600) + 'px;'"></div>
              <div class="chart-label" x-text="item.mois"></div>
            </div>
          </template>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Factures récentes</div>
          <a href="/facture" class="card-link">Tout voir</a>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <template x-for="fact in facturesRecentes">
            <div class="facture-item">
              <div class="facture-info">
                <span class="facture-mois" x-text="fact.mois"></span>
                <span class="facture-conso" x-text="fact.conso + ' kWh'"></span>
              </div>
              <div class="facture-right">
                <span class="facture-prix" x-text="fact.montant + ' Ar'"></span>
                <span class="facture-status" :class="(fact.mois.includes('Mai') && facturePayee) ? 'status-payee' : (fact.paye ? 'status-payee' : 'status-attente')" x-text="(fact.mois.includes('Mai') && facturePayee) ? '● Payée' : (fact.paye ? '● Payée' : '● En attente')"></span>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('dashboardApp', () => ({
        menuOpen: false,
        currentUserId: null,
        userProfile: { prenom: "Utilisateur", nom: "", num_compteur: "CMT-1042", plan: "Standard" },
        initiales: "RJ",
        factureEnAttente: { montant: "48 200", mois: "mai 2025", echeance: "30/06/2025" },
        facturePayee: false,
        consoMoisActuel: 187,
        dernierPaiement: { montant: "42 570", date: "28/05/2025" },
        
        historiqueFactures: [
          { mois: "Déc", montant: 33500, isCurrent: false },
          { mois: "Jan", montant: 36600, isCurrent: false },
          { mois: "Fév", montant: 37200, isCurrent: false },
          { mois: "Mar", montant: 39700, isCurrent: false },
          { mois: "Avr", montant: 42600, isCurrent: false },
          { mois: "Mai", montant: 48200, isCurrent: true }
        ],

        facturesRecentes: [
          { mois: "Mai 2025", conso: 187, montant: "48 200", paye: false },
          { mois: "Avril 2025", conso: 165, montant: "42 570", paye: true },
          { mois: "Mars 2025", conso: 154, montant: "39 732", paye: true }
        ],

        init() {
          const savedId = localStorage.getItem('angovo_user_id');
          if (!savedId) {
            window.location.replace('/connexion');
            return;
          }
          this.currentUserId = parseInt(savedId, 10);

          // Vérification si le paiement a été effectué
          if (localStorage.getItem('angovo_facture_payee') === 'true') {
            this.facturePayee = true;
          }

          this.fetchDashboardData();
        },

        fetchDashboardData() {
          // CORRECTION : Utilisation de l'URL relative
          fetch(`/api/dashboard/${this.currentUserId}`)
          .then(res => res.json())
          .then(data => {
            if(data.userProfile) {
              this.userProfile = data.userProfile;
              if(this.userProfile.prenom && this.userProfile.nom) {
                this.initiales = (this.userProfile.prenom[0] + this.userProfile.nom[0]).toUpperCase();
              }
            }
          })
          .catch(err => console.log("Mode visuel par défaut activé"));
        },

        logout() {
          localStorage.removeItem('angovo_user_id');
          window.location.replace('connexion');
        }
      }));
    });
  </script>
</body>
</html>
