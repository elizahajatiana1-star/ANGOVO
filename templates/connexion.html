<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANGOVO — Connexion</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --or:#E65100;--orl:#FF6D00;
      --gnm:#2E7D32;--blk:#0D0D0D;
      --wh:#FFFFFF;--wh2:#F9F8F6;
      --t1:#111111;--t2:#555555;--t3:#999999;
      --bdr:rgba(0,0,0,0.08);
    }
    body{
      font-family:'DM Sans',sans-serif;
      color:var(--t1);
      background:var(--wh);
      min-height:100vh;
    }
    .nav{
      display:flex;align-items:center;padding:16px 32px;
      background:rgba(255,255,255,0.95);
      border-bottom:1px solid var(--bdr);
    }
    .nav-brand{
      display:flex;align-items:center;gap:14px;
      text-decoration:none;color:inherit;
    }
    .logo-badge {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #2E7D32 0%, #E65100 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(230,81,0,0.2);
    }
    .logo-badge svg {
      width: 26px;
      height: 26px;
      fill: #FFFFFF;
    }
    .brand-txt{
      display:flex;flex-direction:column;
    }
    .brand-main{
      font-size:20px;font-weight:800;color:var(--blk);letter-spacing:0.5px;
    }
    .brand-sub{
      font-size:9.5px;color:var(--gnm);font-weight:700;letter-spacing:0.5px;margin-top:-2px;
    }
    .auth-container{
      max-width:420px;margin:50px auto;padding:0 20px;width:100%;
    }
    .auth-box{
      background:var(--wh);border:1px solid var(--bdr);border-radius:16px;padding:36px 30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.03);
    }
    .auth-title{
      font-size:24px;font-weight:700;margin-bottom:6px;color:var(--blk);
    }
    .auth-subtitle{
      font-size:13.5px;color:var(--t2);margin-bottom:24px;
    }
    .f-group{
      margin-bottom:16px;
    }
    .f-input{
      width:100%;padding:13px 16px;font-size:14px;
      border:1px solid #dcdad4;border-radius:10px;
      background:var(--wh2);outline:none;
    }
    .f-input:focus{
      border-color:var(--or);background:var(--wh);
      box-shadow:0 0 0 3px rgba(230,81,0,0.1);
    }
    .f-btn{
      width:100%;padding:13px;background:var(--or);
      border:none;border-radius:10px;color:var(--wh);
      font-size:14.5px;font-weight:700;cursor:pointer;
      margin-top:6px;
    }
    .f-btn:hover{
      background:var(--orl);
    }
    .auth-footer{
      font-size:13px;text-align:center;margin-top:22px;color:var(--t3);
    }
    .auth-footer a{
      color:var(--or);font-weight:600;text-decoration:none;cursor:pointer;
    }
  </style>
</head>
<body>
  <div>
    <nav class="nav">
      <a href="dashboard.html" class="nav-brand">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24"><path d="M13,2L3,14H11V22L21,10H13V2Z"/></svg>
        </div>
        <div class="brand-txt">
          <span class="brand-main">ANGOVO</span>
          <span class="brand-sub">L'ÉNERGIE À PORTÉE DE MAIN</span>
        </div>
      </a>
    </nav>
    <main class="auth-container">
      <div class="auth-box">
        <h2 class="auth-title">Connexion</h2>
        <p class="auth-subtitle">Accédez à votre espace de gestion intelligent.</p>
        <div>
          <div class="f-group">
            <input type="email" placeholder="Adresse email" required class="f-input" id="emailInput" value="client@angovo.mg">
          </div>
          <div class="f-group">
            <input type="password" placeholder="Mot de passe" required class="f-input" id="passwordInput" value="password123">
          </div>
          <button type="button" onclick="lancerConnexion()" class="f-btn">Se connecter</button>
        </div>

        <p class="auth-footer">
          Nouveau sur Angovo ? <a href="/inscription" onclick="forcer(event)">Créer un compte</a>
        </p>
      </div>
    </main>
  </div>
  
 <script>
    async function lancerConnexion() {
      const emailInput = document.getElementById('emailInput').value;
      const passwordInput = document.getElementById('passwordInput').value;

      try {
        const response = await fetch('http://127.0.0.1:8000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput, password: passwordInput })
        });

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.detail || "Identifiants incorrects");
        }

        // 1. Stockage forcé dans le localStorage via le serveur local
        localStorage.setItem('angovo_user_id', data.user_id);
        console.log("ID enregistré :", data.user_id);

        // 2. Redirection directe vers le dashboard du même dossier
        window.location.href = 'dashboard.html';

      } catch (error) {
        alert("Échec de la connexion : " + error.message);
      }
    }
  </script>
  
</body>
</html>
